[package]
name = "a_la_mort-moifeu"
version = "1.0.0"
edition = "2021"

[lib]
name = "moifeu"
path = "moifeu.rs"

[features]
async = []

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
futures-util = "0.3"
rand = "0.8"
lazy_static = "1"

[profile.release]
opt-level = "s"
