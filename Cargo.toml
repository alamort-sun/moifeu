[package]
name = "a_la_mort-moifeu"
version = "1.0.0"
edition = "2021"

[lib]
path = "fog/mod.rs"
crate-type = ["cdylib"]

[[bin]]
name = "moifeu-pipeline"
path = "moifeu.rs"

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
futures-util = "0.3"
rand = "0.8"
a_la_mort-core = { path = "../core" }

[profile.release]
opt-level = "s"
